name: daily-report

on:
  schedule:
    # GitHub drops/delays scheduled runs, so fire several times; later runs
    # are no-ops once today's report exists (see main.py). UTC; 03:17 ~ 06:17 Israel (summer).
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "37 4 * * *"
    - cron: "7 6 * * *"
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Run the weekly summary only"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python src/main.py ${{ inputs.weekly && '--weekly' || '' }}
      - name: Commit history
        run: |
          git config user.name "market-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git commit -m "Daily report $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
